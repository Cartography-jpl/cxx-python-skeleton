[workspace]
authors = ["Mike Smyth <Mike.M.Smyth@jpl.nasa.gov>"]
channels = ["conda-forge"]
name = "build-pixi"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.13"
pip = "*"
libboost-devel = "*"
libblitz = "*"
compilers = "*"
doxygen = "*"
packaging = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
sphinx = "*"
pytest = "*"
libtool = "*"
automake = "*"
autoconf = "*"
pkg-config="*"
pytest-xdist = "*"
pytest-sugar = "*"
filelock = "*"
ruff = "*"
mypy = "*"
jsonpickle = "*"
ptpython = "*"
ipython = "*"

# Formatting and lint (make format, format-check, lint).
# Pinned: clang-format output differs a little between versions, and
# "make format" should give the same result for everyone.
clang-tools = "22.*"
# clang's builtin headers (lib/clang/22/include), which clang-tidy and clangd need;
# clang-tools doesn't include them. clang-22 rather than the "clang" package,
# which would also pull in the clang compiler driver and a newer binutils.
clang-22 = "22.*"
nanobind = "*"
# mdspan (Kokkos reference implementation) for the numpy <-> Blitz bridge
# (cxx_python_rules/lib/cxx_python_rules_mdspan.h). Pinned to this
# snapshot: 0.6.0 only has std::experimental.
mdspan = "==0.6.1.dev20260223"
# For the CMake reference build of the nanobind module (CMakeLists.txt)
cmake = "*"
ninja = "*"
# Test coverage ("make coverage")
gcovr = "*"
pytest-cov = "*"
# addr2line, for function names and file:line in Exception::stacktrace()
binutils = "*"

[pypi-dependencies]
mkinit = "*"
