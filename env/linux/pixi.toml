[workspace]
authors = ["Mike Smyth <Mike.M.Smyth@jpl.nasa.gov>"]
channels = ["conda-forge"]
name = "build-pixi"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "*"
pip = "*"
libboost-devel = "*"
libblitz = "*"
compilers = "*"
doxygen = "*"
# The committed SWIG wrappers in bindings/python/swig are generated with
# SWIG 4.5. Keep this matched, so regenerated wrappers use the same
# version. Short term, until SWIG is replaced by nanobind.
swig = "4.5.*"
packaging = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
sphinx = "*"
pytest = "*"
libtool = "*"
automake = "*"
autoconf = "*"
pkg-config="*"
pytest-xdist = "*"
pytest-sugar = "*"
filelock = "*"
ruff = "*"
mypy = "*"
jsonpickle = "*"
ptpython = "*"
ipython = "*"

# Tooling for the modernization (see claude_notes/implementation_plan.md S0.4)
clang-tools = "*"
nanobind = "*"
# Test coverage (claude_notes/implementation_plan.md section 4a, "make coverage")
gcovr = "*"
pytest-cov = "*"
# addr2line, for function names and file:line in Exception::stacktrace()
# (claude_notes/implementation_plan.md S1.5)
binutils = "*"

[pypi-dependencies]
mkinit = "*"
